[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-service"
version = "1.0.0"
description = "Владелец платежей: API, outbox, приём результатов обработки и webhook-уведомления"
requires-python = ">=3.12"
dependencies = [
    "broker-kit",
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: требует PostgreSQL (переменная TEST_DATABASE_URL)"]
