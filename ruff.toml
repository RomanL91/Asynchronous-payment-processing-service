# Единые правила линтера для всех пакетов монорепозитория
target-version = "py312"
line-length = 120

[lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# RUF001-003: кириллица в строках и докстрингах — намеренно (документация на русском)
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[lint.isort]
known-first-party = ["broker_kit", "payments_service", "processor_service", "gateway_mock", "tests"]
