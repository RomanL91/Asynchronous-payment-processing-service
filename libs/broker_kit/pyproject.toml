[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-kit"
version = "1.0.0"
description = "Общий messaging-слой сервисов процессинга: контракты событий, топология RabbitMQ, ретраи и DLQ"
requires-python = ">=3.12"
dependencies = [
    "faststream[rabbit,otel]>=0.7,<0.8",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
