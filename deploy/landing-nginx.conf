# Витрина на публичном демо-стенде: те же файлы, что локально,
# но ссылки и подписи карточек ведут на поддомены rlebedev.dev.
# Команды в разделе «Запуск» не трогаются — они про локальный запуск.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once off;
    sub_filter 'стенд: docker compose · localhost' 'демо-стенд · rlebedev.dev';
    sub_filter 'эти адреса работают на вашей машине.' 'эти адреса работают и на вашей машине через localhost.';

    sub_filter 'href="http://localhost:8000/docs"' 'href="https://mkk-bazis-testovoe-api.rlebedev.dev/docs"';
    sub_filter 'href="http://localhost:16686"' 'href="https://mkk-bazis-testovoe-jaeger.rlebedev.dev"';
    sub_filter 'href="http://localhost:15672"' 'href="https://mkk-bazis-testovoe-rabbitmq.rlebedev.dev"';
    sub_filter 'href="http://localhost:8001/docs"' 'href="https://mkk-bazis-testovoe-gateway.rlebedev.dev/docs"';
    sub_filter 'href="http://localhost:8080"' 'href="https://mkk-bazis-testovoe-webhook.rlebedev.dev"';

    sub_filter '<span class="card-d">localhost:8000/docs</span>' '<span class="card-d">mkk-bazis-testovoe-api.rlebedev.dev/docs</span>';
    sub_filter '<span class="card-d">localhost:16686</span>' '<span class="card-d">mkk-bazis-testovoe-jaeger.rlebedev.dev</span>';
    sub_filter '<span class="card-d">localhost:15672 · guest / guest</span>' '<span class="card-d">mkk-bazis-testovoe-rabbitmq.rlebedev.dev · demo / demo</span>';
    sub_filter '<span class="card-d">localhost:8001/docs</span>' '<span class="card-d">mkk-bazis-testovoe-gateway.rlebedev.dev/docs</span>';
    sub_filter '<span class="card-d">localhost:8080</span>' '<span class="card-d">mkk-bazis-testovoe-webhook.rlebedev.dev</span>';
}
