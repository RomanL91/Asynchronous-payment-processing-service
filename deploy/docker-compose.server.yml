# Публичный демо-стенд за Cloudflare Tunnel.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.server.yml up -d --build
#
# Отличия от локального запуска:
# - порты слушают только 127.0.0.1: наружу стенд отдаёт cloudflared, а не сеть хоста;
# - consumer, processor и relay — только во внутренней сети без выхода наружу:
#   webhook_url из публичного API не достучится до домашней сети и интернета (SSRF);
# - RabbitMQ: администратор из .env вместо guest (пользователь demo для UI создаётся отдельно);
# - витрина подменяет localhost-ссылки на публичные поддомены.

networks:
  internal:
    internal: true

x-broker-url: &broker-url
  RABBITMQ_URL: amqp://${RABBITMQ_ADMIN_USER:?задайте в .env}:${RABBITMQ_ADMIN_PASSWORD:?задайте в .env}@rabbitmq:5672/

services:
  postgres:
    ports: !override ["127.0.0.1:5432:5432"]
    networks: [default, internal]
    restart: unless-stopped

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
    ports: !override ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    networks: [default, internal]
    restart: unless-stopped

  jaeger:
    environment:
      MEMORY_MAX_TRACES: 50000
    ports: !override ["127.0.0.1:16686:16686"]
    networks: [default, internal]
    restart: unless-stopped

  payments-migrations:
    networks: [internal]

  payments-api:
    environment:
      <<: *broker-url
      # Памяти на сервере немного: 2 процесса × пул (5+5)
      UVICORN_WORKERS: 2
    ports: !override ["127.0.0.1:8000:8000"]
    networks: [default, internal]

  payments-relay:
    environment: *broker-url
    networks: [internal]

  payments-consumer:
    environment: *broker-url
    networks: [internal]

  processor:
    environment: *broker-url
    networks: [internal]

  gateway-mock:
    ports: !override ["127.0.0.1:8001:8001"]
    networks: [default, internal]

  webhook-receiver:
    ports: !override ["127.0.0.1:8080:8080"]
    networks: [default, internal]
    restart: unless-stopped

  landing:
    volumes:
      - ./deploy/landing-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override ["127.0.0.1:8090:80"]
